[project]
name = "order-processing-service"
version = "0.1.0"
description = "Order processing service built with Django"
readme = "README.md"
authors = [
    { name = "Yuriy Medvedev", email = "yuriy.medvedev.33@mail.ru" }
]
requires-python = ">=3.12"

dependencies = [
    "celery>=5.6.3",
    "django>=6.1.1",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.6",
]